<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Schalterbeamter am Fahrkartenschalter">
  <!-- Flat 2D partner illustration for the "Fahrkarte kaufen" challenge.
       Deliberately drawn WITHOUT a mouth: the conversation screen overlays an animated
       one while the partner speaks, so the art file stays static and the movement lives
       in code. The mouth belongs at 50% / 59% of this box (see scenarios.js). -->

  <!-- station hall -->
  <rect width="400" height="300" fill="#e0f2fe"/>
  <rect y="214" width="400" height="86" fill="#cbd5e1"/>

  <!-- departure board -->
  <rect x="24" y="26" width="104" height="62" rx="6" fill="#1e293b"/>
  <rect x="34" y="38" width="62" height="7" rx="3" fill="#38bdf8"/>
  <rect x="34" y="52" width="80" height="7" rx="3" fill="#64748b"/>
  <rect x="34" y="66" width="46" height="7" rx="3" fill="#64748b"/>

  <!-- clock -->
  <circle cx="330" cy="54" r="26" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
  <path d="M330 38v17l11 8" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- shoulders and uniform -->
  <path d="M112 300c0-48 39-74 88-74s88 26 88 74z" fill="#1d4ed8"/>
  <path d="M176 232l24 26 24-26-24-14z" fill="#bfdbfe"/>
  <rect x="236" y="250" width="30" height="20" rx="4" fill="#facc15"/>
  <rect x="241" y="256" width="20" height="3" rx="1.5" fill="#a16207"/>
  <rect x="241" y="262" width="14" height="3" rx="1.5" fill="#a16207"/>

  <!-- neck -->
  <rect x="184" y="196" width="32" height="34" rx="14" fill="#e8b48c"/>

  <!-- head -->
  <ellipse cx="200" cy="140" rx="60" ry="66" fill="#f3c9a6"/>
  <!-- ears -->
  <circle cx="141" cy="146" r="10" fill="#e8b48c"/>
  <circle cx="259" cy="146" r="10" fill="#e8b48c"/>

  <!-- hair and cap, sitting above the brow line so the face stays open -->
  <path d="M142 116c2-34 26-50 58-50s56 16 58 50c-16-12-35-18-58-18s-42 6-58 18z" fill="#3f3f46"/>
  <path d="M134 78h132a8 8 0 0 1 8 8v6H126v-6a8 8 0 0 1 8-8z" fill="#1e3a8a"/>
  <rect x="118" y="88" width="164" height="13" rx="6" fill="#172554"/>
  <circle cx="200" cy="84" r="7" fill="#facc15"/>

  <!-- brows -->
  <rect x="160" y="120" width="30" height="6" rx="3" fill="#3f3f46"/>
  <rect x="210" y="120" width="30" height="6" rx="3" fill="#3f3f46"/>

  <!-- eyes -->
  <ellipse cx="175" cy="142" rx="9" ry="10" fill="#f8fafc"/>
  <ellipse cx="225" cy="142" rx="9" ry="10" fill="#f8fafc"/>
  <circle cx="176" cy="143" r="4.5" fill="#27272a"/>
  <circle cx="226" cy="143" r="4.5" fill="#27272a"/>

  <!-- nose -->
  <path d="M200 150v14h-8" stroke="#d09b73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- NO MOUTH: the conversation screen draws it at 50% / 59% of this box. -->

  <!-- counter with the glass screen and a ticket -->
  <rect x="0" y="252" width="400" height="48" fill="#e2e8f0"/>
  <rect x="0" y="252" width="400" height="8" fill="#94a3b8"/>
  <rect x="284" y="264" width="64" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <path d="M300 272h32M300 280h20" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
</svg>
